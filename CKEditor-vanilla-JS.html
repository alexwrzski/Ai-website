// CKEditor Starter Template - Vanilla JS Version

// index.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CKEditor with Custom Tokens</title>
  <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
  <style>
    .token-block {
      background: #eef3ff;
      border: 1px dashed #6a6a6a;
      border-radius: 4px;
      padding: 2px 6px;
      display: inline-block;
      font-family: monospace;
      color: #333;
    }
  </style>
</head>
<body>
  <h2>CKEditor with Mortgage Automator-style Tokens</h2>
  <div id="toolbar"></div>
  <div id="editor"></div>

  <script>
    ClassicEditor.create(document.querySelector('#editor'), {
      toolbar: ['bold', 'italic', 'insertVariable', 'insertForeach', 'insertShowIf', 'insertCalc', 'insertDateCalc']
    }).then(editor => {
      window.editor = editor;

      // Custom Insert Commands
      const insertToken = (token) => {
        const viewFragment = editor.data.processor.toView(`<span class='token-block'>${token}</span>`);
        const modelFragment = editor.data.toModel(viewFragment);
        editor.model.insertContent(modelFragment);
      };

      editor.ui.componentFactory.add('insertVariable', locale => {
        const view = new window.CKEDITOR5.ui.button.ButtonView(locale);
        view.set({ label: 'Insert Variable', tooltip: true });
        view.on('execute', () => {
          const name = prompt('Enter variable name (e.g., %%loanamount%%)');
          if (name) insertToken(name);
        });
        return view;
      });

      editor.ui.componentFactory.add('insertForeach', locale => {
        const view = new window.CKEDITOR5.ui.button.ButtonView(locale);
        view.set({ label: 'Insert Foreach Block', tooltip: true });
        view.on('execute', () => insertToken('[[foreach allclientsinfo as aci]]...[[/]]'));
        return view;
      });

      editor.ui.componentFactory.add('insertShowIf', locale => {
        const view = new window.CKEDITOR5.ui.button.ButtonView(locale);
        view.set({ label: 'Insert ShowIf Block', tooltip: true });
        view.on('execute', () => insertToken('[[showif %%loanamount%% > 100]]...[[/]]'));
        return view;
      });

      editor.ui.componentFactory.add('insertCalc', locale => {
        const view = new window.CKEDITOR5.ui.button.ButtonView(locale);
        view.set({ label: 'Insert Calc', tooltip: true });
        view.on('execute', () => insertToken('[[calc %%loanamount%%*%%interestrate%%/%%loanterm%%|%]]'));
        return view;
      });

      editor.ui.componentFactory.add('insertDateCalc', locale => {
        const view = new window.CKEDITOR5.ui.button.ButtonView(locale);
        view.set({ label: 'Insert DateCalc', tooltip: true });
        view.on('execute', () => insertToken('[[datecalc %%today%%+1m| F, j Y]]'));
        return view;
      });
    });
  </script>
</body>
</html>
