<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
       body {
            font-family: Arial, sans-serif;
            background-color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Move container to top */
            min-height: 100vh;
        }

        .container {
            background-color: #444;
            color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            width: 400px;
            position: relative;
            top: 20px; /* Move container up */
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input, button {
            width: calc(100% - 20px); /* Match input and button widths */
            padding: 8px;
            border: none;
            border-radius: 3px;
        }

        button {
            background-color: #58ACFA;
            color: white;
            cursor: pointer;
            margin-top: 10px; /* Add space between inputs and button */
            margin-left: 6.5px;
        }

        .register {
            margin-top: 20px;
            text-align: center;
        }
        a {
            color: aqua;
        }

        .error-message {
            color: #ff4444;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="input-group">
                <label for="username">Username/Email:</label>
                <input type="text" id="username" required>
            </div>

            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit">Login</button>
        </form>

        <div class="error-message" id="errorMessage"></div>
        <div class="loading" id="loading">Logging in...</div>

        <div class="register">
            <p>Don't have an account? 
               <a href="register.html">Register here</a></p>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loading = document.getElementById('loading');
            const submitButton = event.target.querySelector('button[type="submit"]');

            // Show loading state
            loading.style.display = 'block';
            errorMessage.style.display = 'none';
            submitButton.disabled = true;

            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token and user data
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userData', JSON.stringify(data.user));
                    
                    // Redirect to templates page
                    window.location.href = 'templates.html';
                } else {
                    errorMessage.textContent = data.message || 'Login failed';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'Error connecting to server';
                errorMessage.style.display = 'block';
            } finally {
                // Reset loading state
                loading.style.display = 'none';
                submitButton.disabled = false;
            }

            return false;
        }
    </script>
</body>
</html>
