<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
       body {
            font-family: Arial, sans-serif;
            background-color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Move container to top */
            min-height: 100vh;
        }

        .container {
            background-color: #444;
            color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            width: 400px;
            position: relative;
            top: 20px; /* Move container up */
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input, button {
            width: calc(100% - 20px); /* Match input and button widths */
            padding: 8px;
            border: none;
            border-radius: 3px;
        }

        button {
            background-color: #58ACFA;
            color: white;
            cursor: pointer;
            margin-top: 10px; /* Add space between inputs and button */
            margin-left: 6.5px;
        }

        .register {
            margin-top: 20px;
            text-align: center;
        }
        a {
            color: aqua;
        }
    </style>
</head>
<body>
    <div class="container">
        <form id="loginForm" onsubmit="return validateForm()">
            <div class="input-group">
                <label for="username">Username/Email:</label>
                <input type="text" id="username" required>
            </div>

            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit">Login</button>
        </form>

        <div class="register">
            <p>Don't have an account? 
               <a href="register.html" onclick="showRegisterForm()">Register here</a></p>
        </div>
    </div>
</body>
</html>
